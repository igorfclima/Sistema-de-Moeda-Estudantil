spring.application.name=sistema-merito

# ── Server ──────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Database ─────────────────────────────────────────────────────────────────
# Render PostgreSQL exposes DATABASE_URL as  postgresql://user:pass@host:port/db
# Prefixar com jdbc: converte para o formato JDBC aceito pelo Spring
spring.datasource.url=jdbc:${DATABASE_URL:postgresql://localhost:5432/sistema_merito}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:senha123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# Em produção use "none" (Flyway controla o schema).
# Em desenvolvimento pode usar "update" para comodidade.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.database=postgresql
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:TXVpdG8tTGVuZ28tQ2hhdmUtRUpUSVMtU2VncmV0YS0zMkNoYXJzISE=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── CORS ──────────────────────────────────────────────────────────────────────
# Separar múltiplas origens por vírgula:  https://app.vercel.app,http://localhost:3000
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# ── Email (SMTP) ──────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@sistemamerito.com}

# ── Actuator (health check para Render) ───────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
