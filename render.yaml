services:
  - type: web
    name: sistema-merito-api
    runtime: docker
    dockerfilePath: ./backend/sistema-merito/Dockerfile
    dockerContext: ./backend/sistema-merito
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: sistema-merito-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sistema-merito-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: sistema-merito-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: sistema-merito-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sistema-merito-db
          property: password
      - key: DDL_AUTO
        value: update
      - key: SHOW_SQL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # preencher manualmente com a URL do Vercel
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: sistema-merito-db
    plan: free
    databaseName: sistema_merito
    user: merito
